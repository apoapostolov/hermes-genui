from = "seed"

[[prompt]]
id = "none-haiku"
text = "Write a haiku about monsoon rain."
expect = "none"
from = "seed"

[[prompt]]
id = "none-python"
text = "How do I reverse a list in Python?"
expect = "none"
from = "seed"

[[prompt]]
id = "none-translate"
text = "How do you say 'good morning' in Marathi?"
expect = "none"
from = "seed"

[[prompt]]
id = "none-thanks"
text = "Thanks, that's all for today!"
expect = "none"
from = "seed"

[[prompt]]
id = "none-convert"
text = "How many kilometres is 26.2 miles?"
expect = "none"
from = "seed"
