# Proposed blocks and fields (open feature pull requests)
#
# Each prompt below comes from the issue behind one of the open feature pull requests, and is written so the field
# that pull request proposes is the clearest way to answer it. Today's guide has none of those fields yet, so these
# runs are the baseline their results will be compared against once 0.4 moves each block's fields into its own spec.
# `kind` is only set where the chart kind already exists; the scatter, waterfall, histogram and range prompts get
# their kind once those kinds land.

[[prompt]]
id = "chart-forecast-caveat"
text = "Chart my shop's revenue: 2023 £82k, 2024 £94k, 2025 £101k, 2026 £118k, 2027 £145k. Only 2027 is a guess, and the card has to say so rather than leaving it to the title."
expect = "chart"
from = "#24"

[[prompt]]
id = "chart-commute-axes"
text = "Average commute by office: 3 km 18 min, 6 km 26 min, 11 km 38 min, 17 km 44 min, 24 km 52 min. Plot it and name both axes, because minutes against distance is the whole point."
expect = "chart"
kind = "line"
from = "#24"

[[prompt]]
id = "table-price-caveat"
text = "Put the three broadband plans side by side: Basic 100 Mbps £24 a month, Plus 500 Mbps £32, Max 1 Gbps £45. Prices were checked on 12 November, so say that under the table."
expect = "table"
from = "#24"

[[prompt]]
id = "none-caveat-sentence"
text = "Just answer in a sentence: the 2027 revenue figure in that chart is a projection, right?"
expect = "none"
from = "#24"

[[prompt]]
id = "chart-height-weight"
text = "Scatter the height and weight of my five mates: Ana 162 cm 58 kg, Ben 178 cm 74 kg, Cho 171 cm 66 kg, Dev 185 cm 90 kg, Eli 168 cm 61 kg. Both numbers matter, so each point needs its place on two scales."
expect = "chart"
from = "#21"

[[prompt]]
id = "chart-cash-waterfall"
text = "Walk last quarter's cash from opening to closing: opening 41k, sales +28k, refunds -6k, rent -9k, salaries -14k, closing 40k. I want each move and the two totals, not one line through five numbers."
expect = "chart"
from = "#21"

[[prompt]]
id = "chart-order-spread"
text = "How spread out were my 120 orders? 150-300: 18, 300-450: 31, 450-600: 34, 600-750: 25, 750-900: 12. Show the counts in those bands as one shape."
expect = "chart"
from = "#26"

[[prompt]]
id = "chart-delhi-range"
text = "Delhi this week: Mon 12-26, Tue 13-27, Wed 15-29, Thu 16-28, Fri 14-25, Sat 11-23, Sun 12-24, and it's 21 right now. Show each day's low to high with where 21 sits today."
